  "text": "Krill er små krepsdyr som finnes i alle verdens hav og er en naturlig del av dietten til mange fiskearter. Krill befinner seg lavt i næringskjeden og er derfor en marin råvare med høyt innhold av viktige næringsstoffer, samtidig som nivåene av uønskede miljøstoffer generelt er lave.\n\nQRILL Aqua er en krillbasert ingrediens med et bredt spekter av verdifulle næringsstoffer. Den bidrar blant annet med høye nivåer av fosfolipidbundet omega-3, marine proteiner, vannløselige peptider og nukleotider.\n\nI tillegg inneholder krill naturlige vitaminer, mineraler og kitin, samt TMAO (trimetylamin-N-oksid), som fungerer som en osmolytt{{osmolytt}}. Andre viktige komponenter i krill er kolesterol, astaxantin og kolin, næringsstoffer som spiller sentrale roller i fiskens metabolisme, helse og utvikling.",

<style>

<script>
/* Tells the parent page how tall this content is, so the iframe can grow to fit (no inner scrollbar). */
(function(){
  var root=document.querySelector('.foro');
  function send(){
    if(!root||window.parent===window)return;
    window.parent.postMessage({type:'foro-height',height:Math.ceil(root.getBoundingClientRect().height)},'*');
  }
  if('ResizeObserver' in window)new ResizeObserver(send).observe(root);
  window.addEventListener('load',send);window.addEventListener('resize',send);
  setTimeout(send,300);setTimeout(send,1200);
})();
