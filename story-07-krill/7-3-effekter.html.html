  "text": "Effektene av krill er dokumentert gjennom mer enn 135 vitenskapelig publiserte studier på fisk og reker. Studiene viser at krill er en komplett ingrediens med omega-3 i fosfolipidform, en gunstig aminosyreprofil og et naturlig innhold av vitaminer og mineraler.\n\nKrill kan inngå både i vekstfôr og helsefôr, og tilpasses fiskens behov gjennom hele produksjonssyklusen.\n\nForskning viser at effektene av krill kan deles inn i tre hovedområder:\n\n**Appetitt og vekst**\nKrill kan bidra til bedre fôropptak, lavere fôrfaktor og forbedret vekst.\n\n**Helse**\nStudier viser forbedret skinn og organhelse, noe som gir en mer robust fisk.\n\n**Kvalitet**\nBruk av krill har vist positive effekter på filetutbytte, pigmentering, fasthet og redusert filetspalting.\n\nKrill er dermed en råvare med dokumenterte egenskaper som bidrar til god fiskevelferd, effektiv produksjon og høy kvalitet på sluttproduktet.",

.foro__arrow{position:absolute;top:50%;z-index:30;width:46px;height:46px;margin-top:-23px;padding:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:var(--foro-navy);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.3);cursor:pointer;transition:transform .2s ease,opacity .3s ease,background .2s ease}
.foro__arrow:hover{background:var(--foro-navy-dark);transform:scale(1.08)}
.foro__arrow:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 6px var(--foro-navy)}
.foro__arrow svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.foro__arrow--prev{left:calc(50% - var(--foro-card-w) / 2 - 62px)}
.foro__arrow--next{right:calc(50% - var(--foro-card-w) / 2 - 62px)}
.foro__arrow[disabled]{opacity:.35;cursor:default;transform:none;background:var(--foro-navy)}
.foro__progress{width:min(750px,88%);height:11px;margin:0 auto 46px;border:2px solid var(--foro-navy);border-radius:99px;overflow:hidden;background:transparent}
.foro__progress-fill{height:100%;width:0;background:var(--foro-navy);border-radius:99px;transition:width var(--foro-speed) ease}
.foro__text{max-width:780px;margin:0 auto;font-size:clamp(15px,1.9vw,19px);line-height:1.75}
.foro__text p{margin:0 0 1.2em}
.foro__text p:last-child{margin-bottom:0}
.foro__text strong{font-weight:700}
.foro__info{display:inline-flex;align-items:center;justify-content:center;width:1.3em;height:1.3em;margin:0 .1em;padding:2px;vertical-align:-.22em;border:0;border-radius:50%;background:transparent;color:var(--foro-navy);cursor:pointer;transition:transform .2s ease,background .2s ease}
.foro__info:hover,.foro__info[aria-expanded="true"]{background:var(--foro-bubble);transform:scale(1.15)}
.foro__info:focus-visible{outline:2px solid var(--foro-navy);outline-offset:2px}
.foro__info svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.foro__bubble{position:fixed;z-index:9999;width:min(300px,calc(100vw - 24px));padding:18px 20px 20px;border-radius:20px;background:var(--foro-bubble);color:var(--foro-navy);box-shadow:0 12px 30px rgba(15,35,80,.3);text-align:center;font-family:var(--foro-font);font-size:14px;line-height:1.5;opacity:0;transform:translateY(6px) scale(.97);pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.foro__bubble.is-open{opacity:1;transform:none;pointer-events:auto}
.foro__bubble::after{content:"";position:absolute;left:var(--caret-x,50%);width:14px;height:14px;margin-left:-7px;background:var(--foro-bubble);transform:rotate(45deg);top:-7px}
.foro__bubble.is-above::after{top:auto;bottom:-7px}
.foro__bubble-title{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 10px;padding:0 18px 10px;border-bottom:1px solid rgba(31,59,115,.35);font-size:15px;font-weight:700}
.foro__bubble-title svg{flex:none;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.foro__bubble p{margin:0 0 10px}
.foro__bubble p:last-child{margin-bottom:0}
.foro__bubble-close{position:absolute;top:6px;right:8px;width:28px;height:28px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--foro-navy);font-size:20px;line-height:1;cursor:pointer}
.foro__bubble-close:hover{background:rgba(31,59,115,.12)}
@media (max-width:760px){.foro{--foro-card-w:min(250px,64vw)}.foro__hint{position:static;width:150px;margin:6px 0 -10px auto}.foro__stage{margin-top:calc(var(--foro-card-h) * .1 + 20px)}.foro__arrow{width:38px;height:38px;margin-top:-19px}.foro__arrow svg{width:21px;height:21px}.foro__arrow--prev{left:calc(50% - var(--foro-card-w) / 2 - 48px)}.foro__arrow--next{right:calc(50% - var(--foro-card-w) / 2 - 48px)}}
@media (prefers-reduced-motion:reduce){.foro *{transition-duration:.01s !important}}
</style>
<script>
(function(){
'use strict';
var SEARCH='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>';
var AL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5"/><path d="m11 5-7 7 7 7"/></svg>';
var AR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15"/><path d="m13 5 7 7-7 7"/></svg>';
var uid=0;
var LAYOUT=[{s:1,x:0,y:0,veil:0,r:0,sh:'6px 9px 12px rgba(0,0,0,.45)'},{s:.925,x:.72,y:-.10,veil:.55,r:22,sh:'0 6px 16px rgba(20,40,90,.18)'},{s:.93,x:1.19,y:-.245,veil:.72,r:22,sh:'0 6px 16px rgba(20,40,90,.12)'}];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function el(t,c,h){var n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n}
function init(root){
if(root.__foroReady)return;root.__foroReady=true;
var cfg;try{cfg=JSON.parse(root.querySelector('script.foro-config').textContent)}catch(e){console.error('Foropplysningen: ugyldig JSON i config (sjekk anforselstegn og komma)',e);return}
var slides=cfg.slides||[],infos=cfg.infos||{},ui=cfg.ui||{},n=slides.length;if(!n)return;
var current=0,interacted=false,openBtn=null;
var textHtml=String(cfg.text||'').split(/\n\s*\n/).map(function(p){
var safe=esc(p).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>').replace(/\{\{(\w+)\}\}/g,function(m,k){var i=infos[k];if(!i)return'';return'<button type="button" class="foro__info" data-info="'+k+'" aria-expanded="false" aria-label="'+esc(i.title||'Mer info')+'">'+SEARCH+'</button>'});
return'<p>'+safe+'</p>'}).join('');
var swipeHint=null;
if(n>1&&ui.swipeHint){var pid='foro-curve-'+(++uid);
swipeHint=el('div','foro__hint','<svg viewBox="0 0 240 130" aria-hidden="true"><defs><path id="'+pid+'" d="M4 24 Q100 0 190 64"/></defs><text><textPath href="#'+pid+'">'+esc(ui.swipeHint)+'</textPath></text><path d="M70 72C74 114 126 126 208 110" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><path d="M187 94 209 110 185 123" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
root.appendChild(swipeHint)}
var stage=el('div','foro__stage');stage.tabIndex=0;stage.setAttribute('role','region');stage.setAttribute('aria-roledescription','karusell');stage.setAttribute('aria-label',cfg.question||'Karusell');
var slideEls=slides.map(function(s,i){
var d=el('div','foro__slide');d.setAttribute('data-missing','Kort '+(i+1)+' – legg inn bildelenke');
var img=new Image();img.alt=s.alt||'';img.draggable=false;img.decoding='async';if(i>2)img.loading='lazy';
img.onerror=function(){d.classList.add('is-missing')};img.src=s.image||'';d.appendChild(img);
d.addEventListener('click',function(){if(stage.__dragged)return;if(i!==current)goTo(i,true)});
stage.appendChild(d);return d});
var prev=el('button','foro__arrow foro__arrow--prev',AL),next=el('button','foro__arrow foro__arrow--next',AR);
prev.type=next.type='button';prev.setAttribute('aria-label',ui.prev||'Forrige');next.setAttribute('aria-label',ui.next||'Neste');
prev.addEventListener('click',function(){goTo(current-1,true)});next.addEventListener('click',function(){goTo(current+1,true)});
if(n>1){stage.appendChild(prev);stage.appendChild(next)}
root.appendChild(stage);
var fill=el('div','foro__progress-fill'),bar=null;
if(n>1){bar=el('div','foro__progress');bar.setAttribute('role','progressbar');bar.setAttribute('aria-valuemin','1');bar.setAttribute('aria-valuemax',String(n));bar.appendChild(fill);root.appendChild(bar)}
root.appendChild(el('div','foro__text',textHtml));
var bubble=el('div','foro__bubble');bubble.setAttribute('role','dialog');
var bClose=el('button','foro__bubble-close','&times;');bClose.type='button';bClose.setAttribute('aria-label',ui.close||'Lukk');bClose.addEventListener('click',closeBubble);
bubble.appendChild(bClose);var bContent=el('div');bubble.appendChild(bContent);root.appendChild(bubble);
root.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.foro__info');if(!b)return;e.stopPropagation();if(openBtn===b){closeBubble();return}openBubble(b)});
document.addEventListener('click',function(e){if(openBtn&&!bubble.contains(e.target))closeBubble()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&openBtn){var b=openBtn;closeBubble();b.focus()}});
window.addEventListener('resize',positionBubble);window.addEventListener('scroll',positionBubble,{passive:true});
function openBubble(btn){var info=infos[btn.getAttribute('data-info')];if(!info)return;
if(openBtn)openBtn.setAttribute('aria-expanded','false');openBtn=btn;btn.setAttribute('aria-expanded','true');
bContent.innerHTML='<div class="foro__bubble-title">'+SEARCH+'<span>'+esc(info.title||'')+'</span></div>'+(info.body||[]).map(function(p){return'<p>'+esc(p)+'</p>'}).join('');
bubble.setAttribute('aria-label',info.title||'');bubble.classList.add('is-open');positionBubble()}
function closeBubble(){if(openBtn)openBtn.setAttribute('aria-expanded','false');openBtn=null;bubble.classList.remove('is-open')}
function positionBubble(){if(!openBtn)return;var r=openBtn.getBoundingClientRect(),bw=bubble.offsetWidth,bh=bubble.offsetHeight,vw=document.documentElement.clientWidth,vh=window.innerHeight;
var left=Math.max(12,Math.min(r.left+r.width/2-bw/2,vw-bw-12)),below=r.bottom+14,above=r.top-bh-14,useAbove=below+bh>vh-8&&above>8;
bubble.classList.toggle('is-above',useAbove);bubble.style.left=left+'px';bubble.style.top=(useAbove?above:below)+'px';bubble.style.setProperty('--caret-x',(r.left+r.width/2-left)+'px')}
function goTo(i,byUser){i=Math.max(0,Math.min(n-1,i));if(byUser&&i!==current)interacted=true;current=i;render()}
function render(){
var w=slideEls[0].offsetWidth,h=slideEls[0].offsetHeight,maxLevel=root.clientWidth>760?2:1;
slideEls.forEach(function(d,i){var off=i-current,abs=Math.abs(off),dir=off<0?-1:1,L=LAYOUT[Math.min(abs,2)],visible=abs<=maxLevel;
d.style.transform='translate('+(dir*L.x*w)+'px,'+(L.y*h)+'px) scale('+L.s+')';d.style.zIndex=String(20-abs);d.style.opacity=visible?'1':'0';d.style.borderRadius=L.r+'px';d.style.boxShadow=L.sh;d.style.setProperty('--veil',String(L.veil));
d.classList.toggle('is-side',abs>0&&visible);d.classList.toggle('is-far',!visible);d.setAttribute('aria-hidden',abs===0?'false':'true')});
fill.style.width=((current+1)/n*100)+'%';if(bar)bar.setAttribute('aria-valuenow',String(current+1));
prev.disabled=current===0;next.disabled=current===n-1;
if(swipeHint)swipeHint.classList.toggle('is-hidden',interacted);closeBubble()}
var startX=0,startY=0,dx=0,dragging=false,locked=null;
stage.addEventListener('pointerdown',function(e){if(e.target.closest('.foro__arrow'))return;dragging=true;locked=null;dx=0;stage.__dragged=false;startX=e.clientX;startY=e.clientY});
stage.addEventListener('pointermove',function(e){if(!dragging)return;dx=e.clientX-startX;var dy=e.clientY-startY;
if(locked===null&&(Math.abs(dx)>8||Math.abs(dy)>8))locked=Math.abs(dx)>Math.abs(dy)?'x':'y';
if(locked==='x'){stage.classList.add('is-dragging');stage.__dragged=Math.abs(dx)>8;if(e.pointerType==='mouse'){try{stage.setPointerCapture(e.pointerId)}catch(_){}}}});
function endDrag(){if(!dragging)return;dragging=false;stage.classList.remove('is-dragging');if(locked==='x'&&Math.abs(dx)>40)goTo(current+(dx<0?1:-1),true);setTimeout(function(){stage.__dragged=false},0)}
stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);stage.addEventListener('dragstart',function(e){e.preventDefault()});
stage.addEventListener('keydown',function(e){
if(e.key==='ArrowRight'){goTo(current+1,true);e.preventDefault()}
if(e.key==='ArrowLeft'){goTo(current-1,true);e.preventDefault()}
if(e.key==='Home'){goTo(0,true);e.preventDefault()}
if(e.key==='End'){goTo(n-1,true);e.preventDefault()}});
window.addEventListener('resize',render);render()}
function boot(){var r=document.querySelectorAll('[data-foro]');for(var i=0;i<r.length;i++)init(r[i])}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>

<script>
/* Tells the parent page how tall this content is, so the iframe can grow to fit (no inner scrollbar). */
(function(){
  var root=document.querySelector('.foro');
  function send(){
    if(!root||window.parent===window)return;
    window.parent.postMessage({type:'foro-height',height:Math.ceil(root.getBoundingClientRect().height)},'*');
  }
  if('ResizeObserver' in window)new ResizeObserver(send).observe(root);
  window.addEventListener('load',send);window.addEventListener('resize',send);
  setTimeout(send,300);setTimeout(send,1200);
})();
</script>
