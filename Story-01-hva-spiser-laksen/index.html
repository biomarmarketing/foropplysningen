html,body{margin:0;padding:0;background:#f4f4f4;overflow:hidden}
.foro{--navy:#1f3b73;--navy-dark:#16295a;--card-w:min(320px,62vw);--card-h:calc(var(--card-w) / .8);--speed:.5s;
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  position:relative;box-sizing:border-box;max-width:1200px;margin:0 auto;padding:6px 16px 28px;background:#f4f4f4;color:var(--navy);font-family:var(--font);text-align:center;overflow:hidden;-webkit-tap-highlight-color:transparent}
.foro *,.foro *::before,.foro *::after{box-sizing:border-box}
.foro__hint{position:absolute;top:6px;right:max(2%,6px);width:210px;color:var(--navy);font-family:var(--font);font-weight:700;font-style:italic;transition:opacity .4s ease;pointer-events:none;z-index:25}
.foro__hint svg{display:block;width:100%;height:auto;overflow:visible}
.foro__hint text{font-size:14px;fill:currentColor;letter-spacing:.01em}
.foro__hint.is-hidden{opacity:0}
.foro__stage{position:relative;height:var(--card-h);margin:calc(var(--card-h) * .27 + 40px) auto 30px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;outline:none}
.foro__stage.is-dragging{cursor:grabbing}
.foro__stage:focus-visible{outline:3px solid var(--navy);outline-offset:10px;border-radius:12px}
.foro__slide{--veil:0;position:absolute;top:0;left:50%;width:var(--card-w);height:100%;margin-left:calc(var(--card-w) / -2);overflow:hidden;background:#dfe7f1;transition:transform var(--speed) cubic-bezier(.3,.7,.2,1),opacity var(--speed) ease,border-radius var(--speed) ease,box-shadow var(--speed) ease;will-change:transform}
.foro__slide img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.foro__slide::after{content:"";position:absolute;inset:0;background:rgba(244,244,244,var(--veil));transition:background var(--speed) ease;pointer-events:none}
.foro__slide.is-side{cursor:pointer}
.foro__slide.is-far{pointer-events:none}
.foro__arrow{position:absolute;top:50%;z-index:30;width:46px;height:46px;margin-top:-23px;padding:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:var(--navy);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.3);cursor:pointer;transition:transform .2s ease,opacity .3s ease,background .2s ease}
.foro__arrow:hover{background:var(--navy-dark);transform:scale(1.08)}
.foro__arrow:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 6px var(--navy)}
.foro__arrow svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.foro__arrow--prev{left:calc(50% - var(--card-w) / 2 - 62px)}
.foro__arrow--next{right:calc(50% - var(--card-w) / 2 - 62px)}
.foro__arrow[disabled]{opacity:.35;cursor:default;transform:none;background:var(--navy)}
.foro__progress{width:min(750px,88%);height:11px;margin:0 auto;border:2px solid var(--navy);border-radius:99px;overflow:hidden;background:transparent}
.foro__progress-fill{height:100%;width:0;background:var(--navy);border-radius:99px;transition:width var(--speed) ease}
@media (max-width:760px){.foro{--card-w:min(250px,64vw)}.foro__hint{position:static;width:150px;margin:6px 0 -10px auto}.foro__stage{margin-top:calc(var(--card-h) * .1 + 20px)}.foro__arrow{width:38px;height:38px;margin-top:-19px}.foro__arrow svg{width:21px;height:21px}.foro__arrow--prev{left:calc(50% - var(--card-w) / 2 - 48px)}.foro__arrow--next{right:calc(50% - var(--card-w) / 2 - 48px)}}
@media (prefers-reduced-motion:reduce){.foro *{transition-duration:.01s !important}}
</style>

<script>
(function(){
'use strict';
var AL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5"/><path d="m11 5-7 7 7 7"/></svg>';
var AR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15"/><path d="m13 5 7 7-7 7"/></svg>';
var LAYOUT=[{s:1,x:0,y:0,veil:0,r:0,sh:'6px 9px 12px rgba(0,0,0,.45)'},{s:.925,x:.72,y:-.10,veil:.55,r:22,sh:'0 6px 16px rgba(20,40,90,.18)'},{s:.93,x:1.19,y:-.245,veil:.72,r:22,sh:'0 6px 16px rgba(20,40,90,.12)'}];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function el(t,c,h){var n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n}
var root=document.querySelector('[data-foro]');
var cfg;try{cfg=JSON.parse(root.querySelector('script.foro-config').textContent)}catch(e){console.error('Ugyldig JSON i config',e);return}
var slides=cfg.slides||[],ui=cfg.ui||{},n=slides.length;if(!n)return;
var current=0,interacted=false;
var swipeHint=null;
if(n>1&&ui.swipeHint){swipeHint=el('div','foro__hint','<svg viewBox="0 0 240 130" aria-hidden="true"><defs><path id="fc" d="M4 24 Q100 0 190 64"/></defs><text><textPath href="#fc">'+esc(ui.swipeHint)+'</textPath></text><path d="M70 72C74 114 126 126 208 110" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><path d="M187 94 209 110 185 123" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>');root.appendChild(swipeHint)}
var stage=el('div','foro__stage');stage.tabIndex=0;stage.setAttribute('role','region');stage.setAttribute('aria-roledescription','karusell');stage.setAttribute('aria-label',cfg.question||'Karusell');
var slideEls=slides.map(function(s,i){var d=el('div','foro__slide');var img=new Image();img.alt=s.alt||'';img.draggable=false;img.decoding='async';img.src=s.image||'';d.appendChild(img);d.addEventListener('click',function(){if(stage.__dragged)return;if(i!==current)goTo(i,true)});stage.appendChild(d);return d});

function goTo(i,u){i=Math.max(0,Math.min(n-1,i));if(u&&i!==current)interacted=true;current=i;render()}
function render(){
var w=slideEls[0].offsetWidth,h=slideEls[0].offsetHeight,maxLevel=root.clientWidth>760?2:1;
slideEls.forEach(function(d,i){var off=i-current,abs=Math.abs(off),dir=off<0?-1:1,L=LAYOUT[Math.min(abs,2)],vis=abs<=maxLevel;

var sx=0,sy=0,dx=0,drag=false,lock=null;
